name: Benchmark smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and run ten-session pipeline
        run: make smoke
      - name: Retain smoke artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: artifacts/smoke/
          if-no-files-found: warn
